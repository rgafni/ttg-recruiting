<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>TTG Recruiting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23265CDA'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--b:#265CDA;--r:#B41E44;--ink:#14161a;--mu:#6b7280;--line:#e6e8ee;--soft:#f4f7fe}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:0 16px 40px}
a{color:var(--b)}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 10px;background:#fff}
.top h1{font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:30px;line-height:1;text-decoration:none;padding:0 6px 4px 0}
.tag{font-size:12px;color:var(--r);border:1px solid var(--r);border-radius:20px;padding:2px 8px}
.strip{display:flex;align-items:center;gap:2px;margin:4px 0 18px;overflow-x:auto}
.strip a{flex:1;min-width:58px;text-align:center;text-decoration:none;color:var(--ink);padding:8px 2px;border-radius:12px}
.strip a b{display:block;font-size:22px;color:var(--b)}
.strip a span{font-size:12px;color:var(--mu)}
.strip a.on{background:var(--soft)}
.strip i{color:#c3c8d4;font-style:normal}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
section{margin-bottom:8px}
.ny{list-style:none;margin:0;padding:0;counter-reset:n}
.ny li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ny li>a:first-child{flex:1;text-decoration:none;color:var(--ink);min-width:0;position:relative;padding-left:34px}
.ny li>a:first-child::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;font-size:13px;text-align:center;line-height:24px}
.ny li:first-child>a:first-child::before{background:var(--r)}
.ny b,.rows b{display:block;font-weight:600}
small{display:block;color:var(--mu);font-size:14px}
.x{border:0;background:none;color:#b9bec9;font-size:20px;padding:4px;cursor:pointer}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}.rows li li{border:0}
.rows li a{display:block;padding:12px 0;text-decoration:none;color:var(--ink)}
.rows.dim{opacity:.6}
.facts{list-style:none;margin:6px 0;padding:0}
.facts li{padding:3px 0;display:flex;gap:8px;align-items:baseline}
.facts li span{width:18px;flex:none;font-weight:700;text-align:center}
.facts.mini{display:flex;flex-wrap:wrap;gap:2px 12px;margin:4px 0 0;font-size:13px}
.c-ok span{color:#13804a}.c-no span{color:var(--r)}.c-q span{color:#a15c00}
.c-no{color:var(--r)}
.maybe{font-style:normal;font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-weight:400}
.btn{display:inline-block;border:1px solid var(--b);background:var(--b);color:#fff;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;text-align:center;font-family:inherit}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--b)}
.btn.red{background:#fff;color:var(--r);border-color:var(--r)}
.btn.wide{display:block;width:100%;margin:18px 0 6px}
.link{border:0;background:none;color:var(--b);font-size:15px;padding:10px 0;cursor:pointer;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.decide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:20px 0}
.muted{color:var(--mu)}.small{font-size:13px}.pad{padding:12px 0}
.big{font-size:18px;font-weight:600;margin:2px 0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.head p{margin:2px 0}
.qr{text-align:center}.qr svg{display:block;width:96px;height:96px}.qr small{font-weight:700;color:var(--ink)}
.qr.big svg{width:240px;height:240px;margin:0 auto}
textarea,input{width:100%;font:15px/1.45 inherit;font-family:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
textarea:focus,input:focus{outline:2px solid var(--b);border-color:transparent}
.warn{color:var(--r);font-size:14px;margin:6px 0}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.ok{color:#13804a;font-size:13px;font-weight:600}
.chan{list-style:none;margin:0;padding:0}
.chan li{border-bottom:1px solid var(--line);padding:10px 0}
.chan summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none}
.chan summary::-webkit-details-marker{display:none}
.chan summary b::after{content:" \203A";color:var(--mu);font-weight:400}
.chan li .row{margin:6px 0 0}
pre{white-space:pre-wrap;font:14px/1.45 inherit;font-family:inherit;background:var(--soft);border-radius:10px;padding:10px;max-height:300px;overflow:auto}
.sum dt{font-size:13px;color:var(--mu);margin-top:8px}.sum dd{margin:0}
.set summary{color:var(--b);cursor:pointer;margin-top:10px;font-size:15px}
.form label{display:block;font-size:14px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chips button.on{background:var(--b);border-color:var(--b);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer{margin-top:30px;color:var(--mu);font-size:13px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;transition:transform .2s,opacity .2s;opacity:0;visibility:hidden;max-width:90vw;z-index:9}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.flyer{text-align:center;padding:20px 0}.flyer h1{font-size:40px;color:var(--b);margin:6px 0}.flyer .org{color:var(--r);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.flyer ul{text-align:left;display:inline-block;font-size:18px}.flyer .back{display:block;text-align:left;font-size:16px}
@media (min-width:900px){#app{max-width:760px}.ny li{padding:14px 0}}
@media print{.noprint,#toast{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="text.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
